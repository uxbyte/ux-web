name: Publish to npm
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Upgrade npm for OIDC
        run: npm install -g npm@^11.15.0

      - run: npm ci
      - run: npm test
      - run: npm run build --if-present
      - run: npm publish --access public
